# Starts the app on Linux, Windows and macOS for every change to main, every
# release tag and every pull request. No serial hardware is available on the
# runners: this checks that the app installs, starts, lists ports correctly for
# each OS and runs in demo mode.
name: smoke

on:
  push:
    # Other branches are covered by their pull request; limiting push runs
    # avoids running everything twice for a branch that has an open PR.
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # "Run workflow" button, for any branch

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false        # always report all three systems
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        # Same list as INSTALL.md step 2, so the docs are checked too
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover tests -v

      - name: Start-up smoke test
        run: python tests/smoke_test.py

      - name: Release tag matches the app version
        # Only for tags like v1.2.3: the tag must equal serial_terminal.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import serial_terminal; print(serial_terminal.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches version ${version}"
